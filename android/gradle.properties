org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Le cache incrémental du compilateur Kotlin plante sur Windows quand le
# projet et les caches Gradle/pub sont sur des lettres de lecteur différentes
# (ici D: vs C:) : `relativeTo` ne peut pas calculer de chemin relatif entre
# deux racines différentes. Désactiver l'incrémental évite ce crash ; le
# build est juste un peu plus lent.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

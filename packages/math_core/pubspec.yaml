name: math_core
description: >-
  Math Trainer's pure-Dart core: exercise generation, levels, placement,
  scoring, persistence contracts and session replay. Imported by the app
  and the server (path dependency), so both run the same code.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.12.2

# No dependencies, on purpose: the core runs unchanged on the Dart VM
# (server), in JavaScript and in WebAssembly (web app) — rule 1.

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
  # Only tool/recalibrate.dart, which reads an app database file.
  sqflite_common_ffi: ^2.4.2

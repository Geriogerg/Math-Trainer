<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Competitive mental math: difficulty adapts to your answers.">

  <!--
    Home screen (Phase 5 commit 7): manifest.json for Chrome on Android;
    Safari on iPhone reads its own tags — the 180 px touch icon (full bleed,
    iOS rounds it) and apple-mobile-web-app-capable for a full-screen
    launch. Icons are rendered from the operator family
    (app/tool/icons/render_web_icons_test.dart).
  -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Math Trainer">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <!-- The browser bar takes the page's background, day or night. -->
  <meta name="theme-color" content="#F4F6FB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101528" media="(prefers-color-scheme: dark)">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Math Trainer</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Loading screen (Phase 1 commit 3): painted from this file alone, before
    any script or font arrives, so a slow network never shows a blank page.
    Colours from doc/design.md; system font on purpose (Inter is still
    downloading). Driven by flutter_bootstrap.js through window.mtLoader.
  -->
  <style>
    :root { --bg: #F4F6FB; --track: #D6DEEC; --accent: #0F6E56; --text: #101528; --muted: #3E5170; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #101528; --track: #2A3352; --accent: #5DCAA5; --text: #E6F1FB; --muted: #85B7EB; }
    }
    :root[data-theme="dark"] { --bg: #101528; --track: #2A3352; --accent: #5DCAA5; --text: #E6F1FB; --muted: #85B7EB; }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    #mt-loader {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; padding: 0 16px;
      background: var(--bg); color: var(--text);
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity 200ms ease-out; z-index: 10;
    }
    #mt-loader.mt-gone { opacity: 0; pointer-events: none; }
    #mt-loader .mt-ops { font-size: 28px; letter-spacing: 8px; color: var(--accent); }
    #mt-loader .mt-title { font-size: 20px; font-weight: 600; }
    #mt-loader .mt-track {
      width: min(240px, 70vw); height: 6px; border-radius: 3px;
      background: var(--track); overflow: hidden;
    }
    #mt-loader .mt-bar {
      height: 100%; width: 4%; border-radius: 3px; background: var(--accent);
      transition: width 300ms ease-out;
    }
    #mt-loader .mt-status { font-size: 14px; color: var(--muted); min-height: 1.4em; }
    @media (prefers-reduced-motion: reduce) {
      #mt-loader, #mt-loader .mt-bar { transition: none; }
    }
  </style>
</head>
<body>
  <div id="mt-loader" role="progressbar" aria-label="Loading Math Trainer"
       aria-valuemin="0" aria-valuemax="100" aria-valuenow="4">
    <div class="mt-ops" aria-hidden="true">+ − × ÷</div>
    <div class="mt-title">Math Trainer</div>
    <div class="mt-track"><div class="mt-bar"></div></div>
    <div class="mt-status">Downloading the game…</div>
  </div>
  <script>
    // The theme the player chose in the app (shared_preferences stores it
    // in localStorage as a JSON string); the system theme otherwise.
    (function () {
      try {
        var choice = JSON.parse(localStorage.getItem('flutter.theme_mode_preference') || 'null');
        if (choice === 'dark' || choice === 'light') {
          document.documentElement.setAttribute('data-theme', choice);
        }
      } catch (_) { /* storage blocked: system theme */ }
    })();
    window.mtLoader = (function () {
      var root = document.getElementById('mt-loader');
      var bar = root.querySelector('.mt-bar');
      var status = root.querySelector('.mt-status');
      var shown = 0.04;
      function progress(fraction) {
        // Never backwards; a stage may report less than downloads did.
        shown = Math.max(shown, Math.min(fraction, 1));
        bar.style.width = (shown * 100).toFixed(1) + '%';
        root.setAttribute('aria-valuenow', Math.round(shown * 100));
      }
      return {
        progress: progress,
        stage: function (text, fraction) { status.textContent = text; progress(fraction); },
        done: function () {
          progress(1);
          root.classList.add('mt-gone');
          setTimeout(function () { root.remove(); }, 250);
        },
      };
    })();
  </script>
  <script>
    // Filled by tool/web/boot_config.mjs after `flutter build web` (CI does
    // it): the Supabase address and public key, and whether the beta gate is
    // on. Left null (a plain `flutter run`), the app signs in by itself.
    window.mtBootConfig = null; /*__MT_BOOT_CONFIG__*/
  </script>
  <script>
    // Sign-in during the download (Phase 5.1 commit 1). The app needs a
    // signed-in player before its first screen; asking only once Flutter has
    // started costs a round trip or two after a 15-second download. So:
    // - a stored session close to expiry is refreshed now, not by the app;
    // - with no session, the anonymous player is created now — only where
    //   the app would create it at once: no beta gate, or this device passed
    //   it (its code is stored). A new visitor to the gated beta still sees
    //   the gate first, and no player exists before a code.
    // The result lands where supabase_flutter keeps its session; the app
    // waits for window.mtBootAuth before starting its client
    // (infrastructure/web/boot_sign_in.dart), so the two never race. Any
    // failure leaves storage as it was: the app then does what it always did.
    window.mtBootAuth = (function () {
      var config = window.mtBootConfig;
      if (!config || !window.fetch || !window.Promise) return Promise.resolve('none');
      var link = document.createElement('link');
      link.rel = 'preconnect';
      link.href = config.supabaseUrl;
      link.crossOrigin = 'anonymous';
      document.head.appendChild(link);

      var key = 'sb-' + new URL(config.supabaseUrl).hostname.split('.')[0] + '-auth-token';
      function read(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }
      function call(path, body) {
        var abort = new AbortController();
        var timer = setTimeout(function () { abort.abort(); }, 15000);
        return fetch(config.supabaseUrl + path, {
          method: 'POST',
          headers: { apikey: config.publishableKey, 'content-type': 'application/json' },
          body: JSON.stringify(body),
          signal: abort.signal,
        }).then(function (r) {
          clearTimeout(timer);
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        });
      }
      // The token's own expiry (`exp`, seconds) when the session lacks it.
      function expiry(jwt) {
        try {
          var part = String(jwt).split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
          return JSON.parse(atob(part)).exp || 0;
        } catch (_) { return 0; }
      }
      function store(session) {
        if (!session || !session.access_token || !session.refresh_token || !session.user) {
          throw new Error('no session');
        }
        localStorage.setItem(key, JSON.stringify(session));
      }
      var stored = read(key);
      var job;
      if (stored) {
        var session;
        try { session = JSON.parse(stored); } catch (_) { return Promise.resolve('unreadable'); }
        var left = (session && (session.expires_at || expiry(session.access_token)) || 0) - Date.now() / 1000;
        if (!session || !session.refresh_token || left > 120) return Promise.resolve('fresh');
        job = call('/auth/v1/token?grant_type=refresh_token', { refresh_token: session.refresh_token })
          .then(store).then(function () { return 'refreshed'; });
      } else if (!config.betaGate || read('flutter.beta_code')) {
        job = call('/auth/v1/signup', {}).then(store).then(function () { return 'signed up'; });
      } else {
        return Promise.resolve('gate');
      }
      return job.catch(function () { return 'failed'; });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

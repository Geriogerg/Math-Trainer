name: repo_tool
description: >-
  Repository tooling outside the app and the core: Claude Code hooks
  (hooks/), the preview smoke test (smoke/, Node) and the SQL test runner
  (sql/). A package only so the hook rules have tests (test/).
publish_to: none

environment:
  sdk: ^3.12.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

<!doctype html>
<!--
  Served by GitHub Pages once the preview lives on Cloudflare Pages (Phase 3a
  commit 1): old links forward to the new address. CI replaces
  __PREVIEW_URL__ with the repository variable PREVIEW_URL. Progress made at
  the old address stays in that browser's storage for the old origin; a
  player who saved their progress signs in at the new address to get it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Math Trainer has moved</title>
    <meta http-equiv="refresh" content="0; url=__PREVIEW_URL__">
    <script>location.replace('__PREVIEW_URL__' + location.hash);</script>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #f4f5fa; color: #1b1d29; }
      @media (prefers-color-scheme: dark) { body { background: #0f1020; color: #e9eaf5; } a { color: #2de0c4; } }
    </style>
  </head>
  <body>
    <p>Math Trainer has moved to <a href="__PREVIEW_URL__">__PREVIEW_URL__</a>.</p>
  </body>
</html>

# Android compile-only check (Phase 2 commit 12; plan section 5): mobile
# development is paused until Phase 8, but the app must keep compiling for
# Android so returning stays cheap. Not on every push (CI stays fast):
# weekly, on demand (Actions → "Android build" → Run workflow), and when
# this file changes. A failure here is a warning to fix before Phase 8, not
# a reason to block the preview.
name: Android build

on:
  schedule:
    - cron: '0 4 * * 1' # Mondays, 04:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/android.yml

env:
  FLUTTER_VERSION: 3.50.0

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Debug APK (compile only)
        # No Supabase settings: the app would start on "Missing
        # configuration"; it only has to compile.
        run: flutter build apk --debug

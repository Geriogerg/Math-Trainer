# CI: core tests, all tests, analyzer and web build on every push; a push to
# main that passes all of them deploys the preview to GitHub Pages
# (https://<owner>.github.io/<repo>/). Android is not built until Phase 8
# (doc/plan.md, section 5).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.50.0

jobs:
  test:
    # Windows: the golden images are recorded on Windows with the real Inter
    # font, and text antialiasing differs between operating systems.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Core tests
        run: dart test test/domain
      - name: Core tests compiled to JavaScript
        # Players generate on the web, the server will replay on the VM:
        # the pinned sequences of test/domain/determinism must match on
        # both (architecture rule 18).
        run: dart test test/domain -p node
      - name: All tests
        run: flutter test
      - name: Analyzer
        # Infos are fatal too: the tree has zero notices since the
        # material_ui migration (Phase 1 commit 0).
        run: flutter analyze

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Supabase configuration from secrets
        # Empty secrets still compile: the app then shows "Missing
        # configuration" instead of starting.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_PUBLISHABLE_KEY" \
            '{SUPABASE_URL: $url, SUPABASE_PUBLISHABLE_KEY: $key}' > dart_defines.json
      - name: Web build
        # Served from https://<owner>.github.io/<repo>/: every URL in the build
        # (bootstrap, assets, sqflite_sw.js, sqlite3.wasm) resolves against
        # this base. --no-web-resources-cdn: CanvasKit comes from the site,
        # never from Google's CDN (fonts too: web/flutter_bootstrap.js).
        run: >
          flutter build web --release --no-web-resources-cdn
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define-from-file=dart_defines.json
      - name: Upload the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time; a newer push waits rather than cancelling one
    # half-way.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    # The deployed preview, played like a new visitor (Phase 1 commit 8):
    # fresh browser, anonymous player, a full game, a reload, history kept,
    # then the account deletes itself. tool/smoke/preview_smoke.mjs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Global WebSocket (no npm dependency) needs Node 22+.
          node-version: 22
      - name: Smoke test on the preview
        run: node tool/smoke/preview_smoke.mjs "${{ needs.deploy.outputs.page_url }}" google-chrome
      - name: Screenshot of the failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: smoke-failure.png
          if-no-files-found: ignore

# CI: core, app, SQL and tooling tests, analyzers and the web build on every
# push; a push to main (or Actions → CI → Run workflow on main) that passes
# them goes to staging first when STAGING=on (migrations, server, site, the
# full smoke test: Phase 5.2), then applies production's migrations, deploys
# its server and the preview (Cloudflare Pages), and smoke-tests it
# read-only. Monorepo (Phase 2 commit 3): app/ (Flutter),
# packages/math_core/ (pure Dart, shared with the server), tool/.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.50.0

jobs:
  core:
    # The pure-Dart core on the VM and compiled to JavaScript, the repo
    # tooling, and formatting of every Dart file. The Flutter SDK's Dart, so
    # formatting matches the app's.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Dependencies of every package
        # The formatter reads each package's language version from its
        # package config: without it, it formats differently.
        run: |
          (cd app && flutter pub get)
          for dir in packages/math_core server tool; do (cd "$dir" && dart pub get); done
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed app/lib app/test packages server tool
      - name: Core — analyzer
        working-directory: packages/math_core
        run: dart pub get && dart analyze --fatal-infos
      - name: Core — tests on the VM
        working-directory: packages/math_core
        # Every suite states its count and fails below a pinned minimum (plan
        # v3.8): raise a pin when adding tests, never lower one to pass.
        run: bash ../../tool/ci/test_count.sh "Core VM" 1123 -- dart test --reporter expanded
      - name: Core — tests compiled to JavaScript
        # Players generate on the web, the server replays on the VM: the
        # pinned sequences of test/determinism must match on both
        # (architecture rule 18).
        working-directory: packages/math_core
        run: bash ../../tool/ci/test_count.sh "Core JavaScript" 897 -- dart test -p node --reporter expanded
      - name: Tooling — analyzer and tests (Claude Code hook rules)
        working-directory: tool
        run: dart pub get && dart analyze --fatal-infos && bash ci/test_count.sh "Tooling" 10 -- dart test --reporter expanded

  server:
    # The Dart server: analyzer, tests, and its container image builds and
    # answers /health (Phase 2 commit 4). Deployment is the host's job, once
    # the owner has chosen one (render.yaml).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Analyzer and tests
        working-directory: server
        run: dart pub get && dart analyze --fatal-infos && bash ../tool/ci/test_count.sh "Server" 81 -- dart test --reporter expanded
      - name: Container image builds and starts
        run: |
          docker build -f server/Dockerfile -t math-trainer-server .
          docker run -d --name server -p 8080:8080             -e SUPABASE_URL=https://example.supabase.co             -e SUPABASE_SECRET_KEY=sb_secret_placeholder             math-trainer-server
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/health; then exit 0; fi
            sleep 1
          done
          docker logs server
          exit 1

  test:
    # The Flutter app. Windows: the golden images are recorded on Windows
    # with the real Inter font, and text antialiasing differs between
    # operating systems.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: All app tests
        run: bash ../tool/ci/test_count.sh "App" 447 -- flutter test --reporter expanded
      - name: Analyzer
        # Infos are fatal too: the tree has zero notices since the
        # material_ui migration (Phase 1 commit 0).
        run: flutter analyze

  sql:
    # Every Supabase migration applied (twice: they must be idempotent) to a
    # scratch Postgres with a stand-in for Supabase's auth schema, then the
    # SQL tests (Phase 2 commit 2). Never touches the real project.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Migrations and SQL tests
        run: bash tool/sql/test_sql.sh postgresql://postgres:postgres@localhost:5432/postgres

  # --- Staging (Phase 5.2 commit 1) -----------------------------------------
  # With the repository variable STAGING=on, every push to main goes through
  # staging first: its migrations, its server, its site, the full smoke test
  # there — and only then production. Off, these jobs are skipped and
  # production deploys as before. doc/online.md, "Staging".

  migrations-staging:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.STAGING == 'on'
    needs: [core, server, test, sql]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: supabase-migrations-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/supabase-migrate
        with:
          access-token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          db-password: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          supabase-url: ${{ secrets.STAGING_SUPABASE_URL }}
          label: staging

  server-staging:
    # The staging server at this commit (deploy hook), once its database
    # has this commit's migrations.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.STAGING == 'on'
    needs: [migrations-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: render-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deploy and wait for this commit
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}
          SERVER_URL: ${{ vars.STAGING_SERVER_URL }}
        run: bash tool/ci/render_deploy.sh "$SERVER_URL" "$GITHUB_SHA"

  web-staging:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.STAGING == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
        working-directory: app
      # No beta gate on staging: the smoke test plays without a code, and
      # the staging server does not ask for one (render.yaml).
      - uses: ./.github/actions/web-build
        with:
          supabase-url: ${{ secrets.STAGING_SUPABASE_URL }}
          publishable-key: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          server-url: ${{ vars.STAGING_SERVER_URL }}
          beta-gate: ''
          base-href: /
      - uses: actions/upload-artifact@v4
        with:
          name: web-site-staging
          path: app/build/web
          if-no-files-found: error

  deploy-staging:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.STAGING == 'on'
    needs: [web-staging, migrations-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-pages-staging
      cancel-in-progress: false
    outputs:
      url: ${{ steps.pages.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-site-staging
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: ./.github/actions/cloudflare-pages
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          project: ${{ vars.CLOUDFLARE_STAGING_PROJECT || 'math-trainer-staging' }}
          site: ${{ github.workspace }}/site

  smoke-staging:
    # The full visit, on staging: a guest, a game, a reload, the upload and
    # the server levels, then the account deletes itself.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.STAGING == 'on'
    needs: [deploy-staging, server-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke test on staging
        env:
          APP_URL: ${{ needs.deploy-staging.outputs.url }}
          SMOKE_SUPABASE_URL: ${{ vars.STAGING_SERVER_URL && secrets.STAGING_SUPABASE_URL || '' }}
          SMOKE_SUPABASE_KEY: ${{ vars.STAGING_SERVER_URL && secrets.STAGING_SUPABASE_PUBLISHABLE_KEY || '' }}
        run: node tool/smoke/preview_smoke.mjs "$APP_URL" google-chrome
      - name: Screenshot of the failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-staging
          path: smoke-failure.png
          if-no-files-found: ignore

  # --- Production ------------------------------------------------------------

  migrations:
    # The live project gets every migration not yet applied, on main only,
    # once the SQL tests pass (plan: no SQL run by hand from Phase 2
    # commit 2) — and, with STAGING=on, once staging passed its smoke test
    # (a skipped staging is fine: !failure()).
    if: >
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && !failure() && !cancelled()
    needs: [core, server, test, sql, smoke-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One push to the database at a time, never cancelled half-way.
    concurrency:
      group: supabase-migrations
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/supabase-migrate
        with:
          access-token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          db-password: ${{ secrets.SUPABASE_DB_PASSWORD }}
          supabase-url: ${{ secrets.SUPABASE_URL }}
          label: production

  server-production:
    # The production server at this commit, after production's migrations
    # (render.yaml: no automatic deploys). Skipped when neither the server
    # nor the core changed (tool/ci/render_deploy.sh).
    if: >
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && !failure() && !cancelled() && vars.SERVER_URL != ''
    needs: [migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: render-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deploy and wait for this commit
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PRODUCTION }}
          SERVER_URL: ${{ vars.SERVER_URL }}
        run: bash tool/ci/render_deploy.sh "$SERVER_URL" "$GITHUB_SHA"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
        working-directory: app
      # Production. Every URL in the build resolves against the base:
      # https://<owner>.github.io/<repo>/ on GitHub Pages, the root on
      # Cloudflare Pages (Phase 3a commit 1: PREVIEW_HOST=cloudflare).
      # SERVER_URL is a repository variable; empty, the app keeps its
      # sessions local. BETA_GATE: "true" since the invitations went out.
      - uses: ./.github/actions/web-build
        with:
          supabase-url: ${{ secrets.SUPABASE_URL }}
          publishable-key: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          server-url: ${{ vars.SERVER_URL }}
          beta-gate: ${{ vars.BETA_GATE }}
          base-href: ${{ vars.PREVIEW_HOST == 'cloudflare' && '/' || format('/{0}/', github.event.repository.name) }}
      - name: Upload the site (Cloudflare Pages)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PREVIEW_HOST == 'cloudflare'
        uses: actions/upload-artifact@v4
        with:
          name: web-site
          path: app/build/web
          if-no-files-found: error
      - name: Redirect page for the old address
        # Once the preview lives on Cloudflare, GitHub Pages only forwards
        # old links (tool/preview_redirect/index.html) — opt-in since the
        # repository went private (20 Nov): free GitHub Pages serves public
        # repositories only, and the deployment fails with a 404. Set the
        # variable GITHUB_PAGES_REDIRECT=on if Pages works again (public
        # repository or a paid plan).
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PREVIEW_HOST == 'cloudflare' && vars.GITHUB_PAGES_REDIRECT == 'on'
        env:
          PREVIEW_URL: ${{ vars.PREVIEW_URL }}
        run: |
          # Pasted values carry spaces or line breaks: drop them.
          url=$(printf '%s' "$PREVIEW_URL" | tr -d '[:space:]'); url=${url%/}
          printf '%s' "$url" | grep -Eq '^https://[A-Za-z0-9.-]+$' || {
            echo "::error::The repository variable PREVIEW_URL must be just the address, like https://math-trainer-kjc.pages.dev (it is '$url')"
            exit 1
          }
          mkdir -p build/redirect
          sed "s|__PREVIEW_URL__|$url/|g" tool/preview_redirect/index.html > build/redirect/index.html
          cp build/redirect/index.html build/redirect/404.html
      - name: Upload the site (GitHub Pages)
        if: >
          github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
          && (vars.PREVIEW_HOST != 'cloudflare' || vars.GITHUB_PAGES_REDIRECT == 'on')
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ vars.PREVIEW_HOST == 'cloudflare' && 'build/redirect' || 'app/build/web' }}

  deploy:
    # After the migrations: the app deployed never expects SQL the project
    # does not have yet. After deploy-cloudflare: with PREVIEW_HOST=cloudflare
    # this publishes the redirect, which must never point at an address the
    # Cloudflare project does not own (skipped deploy-cloudflare is fine).
    # On Cloudflare, only with GITHUB_PAGES_REDIRECT=on (see the web job).
    if: >
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && (vars.PREVIEW_HOST != 'cloudflare' || vars.GITHUB_PAGES_REDIRECT == 'on')
      && !failure() && !cancelled()
    needs: [core, server, test, web, migrations, deploy-cloudflare]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time; a newer push waits rather than cancelling one
    # half-way.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    # The production preview (Phase 3a commit 1), once PREVIEW_HOST=cloudflare
    # (with PREVIEW_URL, and the secrets CLOUDFLARE_API_TOKEN /
    # CLOUDFLARE_ACCOUNT_ID). After production's migrations and server.
    if: >
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && vars.PREVIEW_HOST == 'cloudflare' && !failure() && !cancelled()
    needs: [core, server, test, web, migrations, server-production]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-pages
      cancel-in-progress: false
    outputs:
      url: ${{ steps.pages.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-site
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: ./.github/actions/cloudflare-pages
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          project: ${{ vars.CLOUDFLARE_PROJECT || 'math-trainer' }}
          site: ${{ github.workspace }}/site
          expected-url: ${{ vars.PREVIEW_URL }}

  smoke:
    # The deployed production preview (Phase 1 commit 8). With STAGING=on
    # (Phase 5.2) it is read-only: the full visit ran on staging, and here
    # the browser blocks every write — the testers' project never sees a
    # test account. It checks the first screen, installability and that
    # this commit's build is served. Without staging, the full visit as
    # before (a guest that deletes itself).
    if: >
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && !failure() && !cancelled()
    needs: [deploy, deploy-cloudflare]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Global WebSocket (no npm dependency) needs Node 22+.
          node-version: 22
      - name: Smoke test on the production preview
        env:
          APP_URL: ${{ vars.PREVIEW_HOST == 'cloudflare' && needs.deploy-cloudflare.outputs.url || needs.deploy.outputs.page_url }}
          SMOKE_READ_ONLY: ${{ vars.STAGING == 'on' && '1' || '' }}
          SMOKE_EXPECT_VERSION: ${{ vars.STAGING == 'on' && vars.PREVIEW_HOST == 'cloudflare' && github.sha || '' }}
          # Full visit only (STAGING off): a code for the beta gate, and the
          # server-levels check with the public key.
          SMOKE_BETA_CODE: ${{ vars.STAGING != 'on' && secrets.SMOKE_BETA_CODE || '' }}
          SMOKE_SUPABASE_URL: ${{ vars.STAGING != 'on' && vars.SERVER_URL && secrets.SUPABASE_URL || '' }}
          SMOKE_SUPABASE_KEY: ${{ vars.STAGING != 'on' && vars.SERVER_URL && secrets.SUPABASE_PUBLISHABLE_KEY || '' }}
        run: |
          if [ -n "$SMOKE_EXPECT_VERSION" ]; then export SMOKE_EXPECT_VERSION="${SMOKE_EXPECT_VERSION::7}"; fi
          node tool/smoke/preview_smoke.mjs "$APP_URL" google-chrome
      - name: Screenshot of the failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: smoke-failure.png
          if-no-files-found: ignore

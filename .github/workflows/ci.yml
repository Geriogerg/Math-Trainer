# CI: core, app, SQL and tooling tests, analyzers and the web build on every
# push; a push to main (or Actions → CI → Run workflow on main) that passes
# them applies the Supabase migrations and
# deploys the preview to GitHub Pages (https://<owner>.github.io/<repo>/),
# then smoke-tests it. Monorepo (Phase 2 commit 3): app/ (Flutter),
# packages/math_core/ (pure Dart, shared with the server), tool/.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.50.0

jobs:
  core:
    # The pure-Dart core on the VM and compiled to JavaScript, the repo
    # tooling, and formatting of every Dart file. The Flutter SDK's Dart, so
    # formatting matches the app's.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Dependencies of every package
        # The formatter reads each package's language version from its
        # package config: without it, it formats differently.
        run: |
          (cd app && flutter pub get)
          for dir in packages/math_core server tool; do (cd "$dir" && dart pub get); done
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed app/lib app/test packages server tool
      - name: Core — analyzer
        working-directory: packages/math_core
        run: dart pub get && dart analyze --fatal-infos
      - name: Core — tests on the VM
        working-directory: packages/math_core
        run: dart test
      - name: Core — tests compiled to JavaScript
        # Players generate on the web, the server replays on the VM: the
        # pinned sequences of test/determinism must match on both
        # (architecture rule 18).
        working-directory: packages/math_core
        run: dart test -p node
      - name: Tooling — analyzer and tests (Claude Code hook rules)
        working-directory: tool
        run: dart pub get && dart analyze --fatal-infos && dart test

  server:
    # The Dart server: analyzer, tests, and its container image builds and
    # answers /health (Phase 2 commit 4). Deployment is the host's job, once
    # the owner has chosen one (render.yaml).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Analyzer and tests
        working-directory: server
        run: dart pub get && dart analyze --fatal-infos && dart test
      - name: Container image builds and starts
        run: |
          docker build -f server/Dockerfile -t math-trainer-server .
          docker run -d --name server -p 8080:8080             -e SUPABASE_URL=https://example.supabase.co             -e SUPABASE_SECRET_KEY=sb_secret_placeholder             math-trainer-server
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/health; then exit 0; fi
            sleep 1
          done
          docker logs server
          exit 1

  test:
    # The Flutter app. Windows: the golden images are recorded on Windows
    # with the real Inter font, and text antialiasing differs between
    # operating systems.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: All app tests
        run: flutter test
      - name: Analyzer
        # Infos are fatal too: the tree has zero notices since the
        # material_ui migration (Phase 1 commit 0).
        run: flutter analyze

  sql:
    # Every Supabase migration applied (twice: they must be idempotent) to a
    # scratch Postgres with a stand-in for Supabase's auth schema, then the
    # SQL tests (Phase 2 commit 2). Never touches the real project.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Migrations and SQL tests
        run: bash tool/sql/test_sql.sh postgresql://postgres:postgres@localhost:5432/postgres

  migrations:
    # The live project gets every migration not yet applied, on main only,
    # once the SQL tests pass (plan: no SQL run by hand from Phase 2
    # commit 2). The access token and database password are secrets: GitHub
    # masks them, and nothing here echoes them.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [core, server, test, sql]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One push to the database at a time, never cancelled half-way.
    concurrency:
      group: supabase-migrations
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Secrets present
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_URL" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN or SUPABASE_DB_PASSWORD missing: migrations not applied (doc/online.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: latest
      - name: Apply pending migrations
        if: steps.secrets.outputs.ready == 'true'
        # The project ref is the subdomain of the project URL.
        # On failure the CLI's last lines also become an annotation: job
        # logs need a signed-in reader, annotations don't. GitHub masks the
        # secrets in both; the literal replacements below are a second guard.
        run: |
          ref="${SUPABASE_URL#https://}"
          ref="${ref%%.*}"
          supabase --version
          run_cli() {
            local what="$1"
            shift
            if "$@" > cli.log 2>&1; then
              cat cli.log
              return 0
            fi
            cat cli.log
            local msg
            msg="$(tail -n 12 cli.log)"
            msg="${msg//"$SUPABASE_DB_PASSWORD"/***}"
            msg="${msg//"$SUPABASE_ACCESS_TOKEN"/***}"
            msg="${msg//'%'/%25}"
            msg="${msg//$'\r'/}"
            msg="${msg//$'\n'/%0A}"
            echo "::error title=supabase ${what} failed::${msg}"
            return 1
          }
          run_cli link supabase link --project-ref "$ref"
          # `--remote`: newer CLIs push to a local stack unless told
          # otherwise (the first live run failed on 127.0.0.1:54322).
          # `--yes`: no one is there to answer the confirmation prompt.
          run_cli "db push" supabase db push --remote --yes

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Supabase configuration from secrets
        # Empty secrets still compile: the app then shows "Missing
        # configuration" instead of starting. SERVER_URL is a repository
        # *variable* (public, not a secret), set once the server is
        # deployed; empty, the app keeps its sessions local and pending.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SERVER_URL: ${{ vars.SERVER_URL }}
          # The beta gate (Phase 3a commit 3): "true" from the repository
          # variable BETA_GATE once the owner sends the invitations.
          BETA_GATE: ${{ vars.BETA_GATE }}
        # APP_VERSION: the build's commit, stored with feedback (commit 5).
        run: |
          jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_PUBLISHABLE_KEY" \
            --arg server "$SERVER_URL" --arg gate "$BETA_GATE" \
            --arg version "${GITHUB_SHA::7}" \
            '{SUPABASE_URL: $url, SUPABASE_PUBLISHABLE_KEY: $key, SERVER_URL: $server, BETA_GATE: $gate, APP_VERSION: $version}' \
            > dart_defines.json
      - name: Web build
        # Every URL in the build (bootstrap, assets, sqflite_sw.js,
        # sqlite3.wasm) resolves against the base: https://<owner>.github.io/
        # <repo>/ on GitHub Pages, the root on Cloudflare Pages (Phase 3a
        # commit 1: repository variable PREVIEW_HOST=cloudflare, set by the
        # owner). --no-web-resources-cdn: CanvasKit comes from the site,
        # never from Google's CDN (fonts too: web/flutter_bootstrap.js).
        env:
          BASE_HREF: ${{ vars.PREVIEW_HOST == 'cloudflare' && '/' || format('/{0}/', github.event.repository.name) }}
        run: >
          flutter build web --release --no-web-resources-cdn
          --base-href "$BASE_HREF"
          --dart-define-from-file=dart_defines.json
      - name: Upload the site (Cloudflare Pages)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PREVIEW_HOST == 'cloudflare'
        uses: actions/upload-artifact@v4
        with:
          name: web-site
          path: app/build/web
          if-no-files-found: error
      - name: Redirect page for the old address
        # Once the preview lives on Cloudflare, GitHub Pages only forwards
        # old links (tool/preview_redirect/index.html).
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PREVIEW_HOST == 'cloudflare'
        env:
          PREVIEW_URL: ${{ vars.PREVIEW_URL }}
        working-directory: .
        run: |
          case "$PREVIEW_URL" in https://*) ;; *) echo "::error::PREVIEW_URL must be the https address of the Cloudflare preview"; exit 1 ;; esac
          mkdir -p build/redirect
          sed "s|__PREVIEW_URL__|${PREVIEW_URL%/}/|g" tool/preview_redirect/index.html > build/redirect/index.html
          cp build/redirect/index.html build/redirect/404.html
      - name: Upload the site (GitHub Pages)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ vars.PREVIEW_HOST == 'cloudflare' && 'build/redirect' || 'app/build/web' }}

  deploy:
    # After the migrations: the app deployed never expects SQL the project
    # does not have yet. After deploy-cloudflare: with PREVIEW_HOST=cloudflare
    # this publishes the redirect, which must never point at an address the
    # Cloudflare project does not own (skipped deploy-cloudflare is fine).
    if: >
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && !failure() && !cancelled()
    needs: [core, server, test, web, migrations, deploy-cloudflare]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time; a newer push waits rather than cancelling one
    # half-way.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    # Phase 3a commit 1, dormant until the owner sets the repository variable
    # PREVIEW_HOST=cloudflare (with PREVIEW_URL, and the secrets
    # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID): Cloudflare Pages serves
    # brotli, GitHub Pages only gzip (doc/decisions.md, "Preview host").
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PREVIEW_HOST == 'cloudflare'
    needs: [core, server, test, web, migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-pages
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ vars.CLOUDFLARE_PROJECT || 'math-trainer' }}
      PREVIEW_URL: ${{ vars.PREVIEW_URL }}
    outputs:
      url: ${{ steps.address.outputs.url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-site
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create the Cloudflare Pages project (first run)
        run: |
          npx --yes wrangler@4 pages project list | grep -q " $PROJECT " \
            || npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main
      - name: The project's address must be PREVIEW_URL
        # A taken name gets a suffix (math-trainer-xyz.pages.dev): the plain
        # name then belongs to a stranger, and the redirect would send
        # players there. The address is public; the token is never printed.
        id: address
        run: |
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT" \
            | jq -r '.result.subdomain // empty')
          [ -n "$sub" ] || { echo "::error::Could not read the Cloudflare project's address"; exit 1; }
          url="https://$sub"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Cloudflare Pages address: $url" >> "$GITHUB_STEP_SUMMARY"
          if [ "${PREVIEW_URL%/}" != "$url" ]; then
            echo "::error::The Cloudflare project's address is $url but the repository variable PREVIEW_URL is '$PREVIEW_URL'. Set PREVIEW_URL to $url and re-run CI; the GitHub Pages redirect and the smoke test wait until they match."
            exit 1
          fi
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy site --project-name="$PROJECT" --branch=main --commit-dirty=true

  smoke:
    # The deployed preview, played like a new visitor (Phase 1 commit 8):
    # fresh browser, anonymous player, a full game, a reload, history kept,
    # then the account deletes itself. tool/smoke/preview_smoke.mjs.
    # On Cloudflare once PREVIEW_HOST=cloudflare (the skipped deploy job
    # must not skip this one: hence !failure()).
    if: >
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && !failure() && !cancelled()
    needs: [deploy, deploy-cloudflare]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Global WebSocket (no npm dependency) needs Node 22+.
          node-version: 22
      - name: Smoke test on the preview
        env:
          APP_URL: ${{ vars.PREVIEW_HOST == 'cloudflare' && needs.deploy-cloudflare.outputs.url || needs.deploy.outputs.page_url }}
          # A code for the beta gate, when it is on (doc/online.md).
          SMOKE_BETA_CODE: ${{ secrets.SMOKE_BETA_CODE }}
          # With a server in the build: also check the game was uploaded,
          # validated and turned into server levels (the public key only).
          SMOKE_SUPABASE_URL: ${{ vars.SERVER_URL && secrets.SUPABASE_URL || '' }}
          SMOKE_SUPABASE_KEY: ${{ vars.SERVER_URL && secrets.SUPABASE_PUBLISHABLE_KEY || '' }}
        run: node tool/smoke/preview_smoke.mjs "$APP_URL" google-chrome
      - name: Screenshot of the failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: smoke-failure.png
          if-no-files-found: ignore
